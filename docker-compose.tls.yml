# Optional: the same site over HTTPS and HTTP/2 on https://localhost:8443
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# Two things change. API keys no longer cross the network in clear. And HTTP/2
# carries every request of a browser over one connection, so the limit of six
# live run pages per browser is gone.
#
# The port is bound to this machine only. The certificate is self-issued, and
# this file is for trying TLS locally, not for exposing the site.

services:
  tls:
    image: caddy:2-alpine
    volumes:
      - ./tls/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${TLS_PORT:-8443}:8443"

  web:
    volumes:
      # Lets nginx see the real caller behind the TLS proxy, so per-address
      # limits keep counting people and not the proxy.
      - ./tls/realip.conf:/etc/nginx/conf.d/realip.conf:ro
    depends_on:
      tls:
        condition: service_started
