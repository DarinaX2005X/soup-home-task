# Test stack. Adds fault injection and process stats to the API, a readable
# API log, a database port for the tests to read the truth from, and the test
# runner itself.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm tests

services:
  db:
    ports:
      - "${DB_PORT:-54329}:5432"

  api:
    environment:
      TEST_HOOKS: "1"
      LOG_FILE: /logs/api.log
      # The tests create hundreds of projects from one address.
      SIGNUPS_PER_HOUR: "1000000"
    volumes:
      - logs:/logs

  # A second API instance on the same database. Tests write through one
  # instance and read live through the other.
  api2:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://simmer_app:${APP_DB_PASSWORD:-app-local-only}@db:5432/simmer
      MIGRATE_DATABASE_URL: postgres://simmer_owner:${OWNER_DB_PASSWORD:-owner-local-only}@db:5432/simmer
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-local-only}
      # This instance is the one with sign-up locked down, for the tests of that.
      SIGNUP_TOKEN: test-invite-code
      SIGNUPS_PER_HOUR: "4"
    depends_on:
      api:
        condition: service_healthy

  # The optional HTTPS and HTTP/2 front, so the tests can use it too.
  tls:
    extends:
      file: docker-compose.tls.yml
      service: tls

  web:
    volumes:
      - ./tls/realip.conf:/etc/nginx/conf.d/realip.conf:ro
    depends_on:
      tls:
        condition: service_started

  tests:
    build:
      context: .
      target: tests
    profiles: ["test"]
    environment:
      WEB_URL: http://web
      API_URL: http://api:3000
      API2_URL: http://api2:3000
      TLS_URL: https://tls:8443
      OWNER_DATABASE_URL: postgres://simmer_owner:${OWNER_DB_PASSWORD:-owner-local-only}@db:5432/simmer
      APP_DATABASE_URL: postgres://simmer_app:${APP_DB_PASSWORD:-app-local-only}@db:5432/simmer
      API_LOG_FILE: /logs/api.log
      EVIDENCE_DIR: /evidence
      CAN_CRASH_API: "1"
      SEED: ${SEED:-20261110}
    volumes:
      - logs:/logs:ro
      - ./docs/evidence:/evidence
    depends_on:
      web:
        condition: service_started

volumes:
  logs:
